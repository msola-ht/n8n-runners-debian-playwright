name: Build Distroless n8n Runners (From Official Source)

on:
  workflow_dispatch:
    inputs:
      n8n_version:
        description: 'n8n version tag (leave empty for latest release)'
        required: false
        default: ''
      force_build:
        description: 'Force build even if image exists'
        required: false
        default: false
        type: boolean
      release_only:
        description: 'Only create release (skip build)'
        required: false
        default: false
        type: boolean
  schedule:
    # 每天检查一次新版本 (UTC 时间 00:00)
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - 'Dockerfile.distroless'
      - '.github/workflows/build-distroless-runners.yml'

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: lunare

jobs:
  # Step 1: 获取 n8n 最新发行版版本号
  get-latest-version:
    name: Get Latest n8n Version
    runs-on: ubuntu-latest
    outputs:
      n8n_version: ${{ steps.version.outputs.version }}
      n8n_tag: ${{ steps.version.outputs.tag }}
      source_repo: ${{ steps.version.outputs.source_repo }}

    steps:
      - name: Get latest n8n release
        id: version
        run: |
          if [ -n "${{ github.event.inputs.n8n_version }}" ]; then
            # 使用用户指定的版本
            TAG="${{ github.event.inputs.n8n_version }}"
            VERSION=$(echo "$TAG" | sed -E 's/^(v|n8n@)//')
            echo "Using specified version: $VERSION"
          else
            # 获取 n8n-io/n8n 最新 release 版本
            echo "Fetching latest n8n release from GitHub API..."

            # 获取最新 release 信息
            LATEST_RELEASE=$(curl -sL "https://api.github.com/repos/n8n-io/n8n/releases/latest" \
              -H "Accept: application/vnd.github.v3+json")

            # 获取原始 tag 名称
            TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
            # 提取版本号（移除 v 或 n8n@ 前缀）
            VERSION=$(echo "$TAG" | sed -E 's/^(v|n8n@)//')

            if [ "$TAG" = "null" ] || [ -z "$TAG" ]; then
              echo "::error::Failed to fetch latest version from GitHub API"
              exit 1
            fi

            echo "Latest n8n tag: $TAG"
            echo "Latest n8n version: $VERSION"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "source_repo=n8n-io/n8n" >> $GITHUB_OUTPUT

  # Step 2: 检查 Docker Hub 镜像是否已存在
  check-image:
    name: Check Docker Hub Image
    runs-on: ubuntu-latest
    needs: get-latest-version
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Check if image exists
        id: check
        run: |
          IMAGE_NAME="${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless"
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"

          echo "Checking if ${IMAGE_NAME}:${VERSION} exists..."

          # 检查镜像是否存在
          if docker manifest inspect ${IMAGE_NAME}:${VERSION} >/dev/null 2>&1; then
            echo "Image ${IMAGE_NAME}:${VERSION} already exists"
            if [ "${{ github.event.inputs.force_build }}" == "true" ]; then
              echo "Force build enabled, proceeding with build"
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "Skipping build (use force_build=true to override)"
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Image ${IMAGE_NAME}:${VERSION} does not exist, proceeding with build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # Step 3: 克隆 n8n 源代码并构建
  build-from-source:
    name: Build n8n from Source
    runs-on: ubuntu-latest
    needs: [get-latest-version, check-image]
    if: needs.check-image.outputs.should_build == 'true'
    outputs:
      n8n_version: ${{ needs.get-latest-version.outputs.n8n_version }}

    steps:
      - name: Checkout n8n repository
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.get-latest-version.outputs.source_repo }}
          ref: ${{ needs.get-latest-version.outputs.n8n_tag }}
          path: n8n-source
          sparse-checkout: |
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            turbo.json
            .npmrc
            patches/
            scripts/
            src/
            packages/
            tsconfig.json
          sparse-checkout-cone-mode: false

      - name: Show current commit
        working-directory: n8n-source
        run: |
          echo "Current commit:"
          git log -1 --oneline
          echo "Current tag:"
          git describe --tags --exact-match 2>/dev/null || echo "no tag"

      - name: Read pnpm version from source
        id: pnpm-version
        working-directory: n8n-source
        run: |
          PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager")
          echo "packageManager: $PACKAGE_MANAGER"
          PNPM_VERSION=$(echo "$PACKAGE_MANAGER" | sed 's/pnpm@//')
          echo "pnpm-version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "Detected pnpm version: $PNPM_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.pnpm-version }}

      - name: Try to restore node modules from cache
        id: cache-node
        uses: actions/cache@v4
        with:
          path: n8n-source/node_modules
          key: n8n-node-${{ needs.get-latest-version.outputs.n8n_version }}-${{ hashFiles('n8n-source/pnpm-lock.yaml') }}
          restore-keys: |
            n8n-node-${{ needs.get-latest-version.outputs.n8n_version }}-
            n8n-node-

      - name: Try to restore build output from cache
        id: cache-dist
        uses: actions/cache@v4
        with:
          path: n8n-source/dist
          key: n8n-dist-${{ needs.get-latest-version.outputs.n8n_version }}

      - name: Install dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: n8n-source
        run: |
          echo "Cache miss - Installing dependencies with pnpm..."
          pnpm install --frozen-lockfile=false

      - name: Build n8n
        if: steps.cache-dist.outputs.cache-hit != 'true'
        working-directory: n8n-source
        run: |
          echo "Cache miss - Building n8n..."
          pnpm build:n8n

      - name: Verify build output
        working-directory: n8n-source
        run: |
          echo "Verifying build output..."
          ls -la dist/
          ls -la dist/task-runner-javascript/ || echo "task-runner-javascript not found!"

          if [ ! -d "dist/task-runner-javascript" ]; then
            echo "::error::task-runner-javascript directory not found in dist/"
            exit 1
          fi

      - name: Build cache status
        run: |
          echo "### Cache Status :hammer_and_wrench:" >> $GITHUB_STEP_SUMMARY
          echo "- Node modules: ${{ steps.cache-node.outputs.cache-hit == 'true' && '✅ Restored from cache' || '❌ Cache miss - Built from source' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build output: ${{ steps.cache-dist.outputs.cache-hit == 'true' && '✅ Restored from cache' || '❌ Cache miss - Built from source' }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: task-runner-dist
          path: n8n-source/dist
          retention-days: 1

      - name: Create packages archive without node_modules
        run: |
          # 创建临时目录
          mkdir -p /tmp/packages-clean
          # 复制 packages 目录，排除 node_modules
          rsync -av --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            n8n-source/packages/ /tmp/packages-clean/

      - name: Upload packages artifacts (without node_modules)
        uses: actions/upload-artifact@v4
        with:
          name: task-runner-packages
          path: /tmp/packages-clean
          retention-days: 1

  # Step 4: 构建 Distroless 镜像（多架构）
  build-distroless-runners:
    name: Build Distroless Runners
    runs-on: ubuntu-latest
    needs: [get-latest-version, build-from-source]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: task-runner-dist
          path: dist

      - name: Download packages artifacts
        uses: actions/download-artifact@v4
        with:
          name: task-runner-packages
          path: packages

      - name: Verify artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la dist/
          ls -la dist/task-runner-javascript/
          ls -la packages/@n8n/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.distroless
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          build-args: |
            NODE_VERSION=22.21.1
            PYTHON_VERSION=3.13
            N8N_VERSION=${{ needs.get-latest-version.outputs.n8n_version }}
            N8N_RELEASE_TYPE=stable
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/n8n-runners-distroless-${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-runners-distroless-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/n8n-runners-distroless-${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}.tar
          retention-days: 7

  # Step 5: 创建多架构 manifest
  create-manifest:
    runs-on: ubuntu-latest
    needs: [get-latest-version, build-distroless-runners]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE_NAME="${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless"
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"

          # 创建版本标签的 manifest
          docker buildx imagetools create \
            -t ${IMAGE_NAME}:${VERSION} \
            ${IMAGE_NAME}:${VERSION}-amd64 \
            ${IMAGE_NAME}:${VERSION}-arm64

          # 创建 latest 标签
          docker buildx imagetools create \
            -t ${IMAGE_NAME}:latest \
            ${IMAGE_NAME}:${VERSION}-amd64 \
            ${IMAGE_NAME}:${VERSION}-arm64

          echo "✅ Manifests created successfully!"
          echo "📍 Image: ${IMAGE_NAME}:${VERSION}"
          echo "📍 Multi-arch support: amd64, arm64"

  # Step 6: 仅发布 Release（手动触发，从 Docker Hub 拉取镜像）
  release-only:
    name: Release Only (Pull from Docker Hub)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_only == 'true'
    permissions:
      contents: write

    steps:
      - name: Get version from input
        id: version
        run: |
          if [ -n "${{ github.event.inputs.n8n_version }}" ]; then
            VERSION="${{ github.event.inputs.n8n_version }}"
            VERSION=$(echo "$VERSION" | sed -E 's/^(v|n8n@)//')
          else
            # 获取最新版本
            LATEST_RELEASE=$(curl -sL "https://api.github.com/repos/n8n-io/n8n/releases/latest" \
              -H "Accept: application/vnd.github.v3+json")
            VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name' | sed -E 's/^(v|n8n@)//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating release for version: $VERSION"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull and export images from Docker Hub
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p /tmp/images

          # 使用 buildx 拉取并导出特定平台的镜像
          # Distroless amd64
          docker pull --platform=linux/amd64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}
          docker tag ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION} ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-amd64
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-amd64 -o /tmp/images/n8n-runners-distroless-${VERSION}-amd64.tar
          docker rmi ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-amd64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}

          # Distroless arm64
          docker pull --platform=linux/arm64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}
          docker tag ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION} ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-arm64
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-arm64 -o /tmp/images/n8n-runners-distroless-${VERSION}-arm64.tar
          docker rmi ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-arm64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}

          ls -la /tmp/images

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-distroless
          name: n8n Runners v${{ steps.version.outputs.version }} (Distroless)
          body: |
            ## 特性
            - 基于 Google Distroless (cc-debian12)
            - 从 n8n-io/n8n 官方源码构建 v${{ steps.version.outputs.version }}
            - 多架构支持：amd64、arm64
            - **安全加固**：移除 shell、包管理器和所有系统工具
            - **最小化攻击面**：仅包含运行所需的二进制文件和库
            - **内置功能**：
              - JavaScript 和 Python 任务运行器
              - ffmpeg（用于视频/音频处理）
              - Python 包：markdown、Pillow、imageio-ffmpeg、numpy

            ## 可用镜像

            ### Distroless 镜像
            - `${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${{ steps.version.outputs.version }}` (amd64 + arm64)
            - `${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:latest`

            ## 离线安装

            下载下方 tar 文件并加载：

            ```bash
            # 加载 Distroless 镜像
            docker load -i n8n-runners-distroless-${{ steps.version.outputs.version }}-amd64.tar
            docker load -i n8n-runners-distroless-${{ steps.version.outputs.version }}-arm64.tar
            ```

            ## 源码
            - 构建自：https://github.com/n8n-io/n8n/releases/tag/v${{ steps.version.outputs.version }}

            ## 使用方法

            ### Distroless 镜像（推荐用于生产环境）
            ```bash
            docker run -d \
              -e N8N_RUNNERS_AUTH_TOKEN=your-token \
              -e N8N_RUNNERS_TASK_BROKER_URI=http://your-n8n:5679 \
              -p 5680:5680 \
              ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${{ steps.version.outputs.version }}
            ```

            ## 拉取镜像
            ```bash
            docker pull ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${{ steps.version.outputs.version }}
            ```

            ## 安全说明
            Distroless 镜像不包含 shell 或调试工具，如果需要调试，请使用 Debian 版本镜像。
          draft: false
          prerelease: false
          files: /tmp/images/*.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 7: 创建 GitHub Release
  create-release:
    runs-on: ubuntu-latest
    needs: [get-latest-version, create-manifest]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      needs.create-manifest.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Distroless image artifacts
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: n8n-runners-distroless-*
          path: /tmp/images
          merge-multiple: true

      - name: Check if artifacts exist
        id: check-artifacts
        run: |
          if [ -d "/tmp/images" ] && [ "$(ls -A /tmp/images)" ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
            echo "Found build artifacts"
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            echo "No artifacts found, will pull from Docker Hub"
          fi

      - name: Rename image files
        if: steps.check-artifacts.outputs.has_artifacts == 'true'
        run: |
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"
          cd /tmp/images

          # 遍历所有 tar 文件并重命名
          for file in *.tar; do
            if [ -f "$file" ]; then
              # 检查文件名是否已经包含版本号
              if echo "$file" | grep -q "${VERSION}"; then
                echo "File already has version: $file"
              else
                # 使用 sed 在架构名称前插入版本号
                new_name=$(echo "$file" | sed "s/-\(amd64\|arm64\)\.tar/-$VERSION-\1.tar/")
                mv "$file" "$new_name"
                echo "Renamed: $file -> $new_name"
              fi
            fi
          done

          ls -la

      - name: Set up Docker Buildx
        if: steps.check-artifacts.outputs.has_artifacts == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Pull and export images from Docker Hub
        if: steps.check-artifacts.outputs.has_artifacts == 'false'
        run: |
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"
          mkdir -p /tmp/images

          # 使用 buildx 拉取并导出特定平台的镜像
          # Distroless amd64
          docker pull --platform=linux/amd64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}
          docker tag ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION} ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-amd64
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-amd64 -o /tmp/images/n8n-runners-distroless-${VERSION}-amd64.tar
          docker rmi ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-amd64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}

          # Distroless arm64
          docker pull --platform=linux/arm64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}
          docker tag ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION} ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-arm64
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-arm64 -o /tmp/images/n8n-runners-distroless-${VERSION}-arm64.tar
          docker rmi ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}-arm64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${VERSION}

          ls -la /tmp/images

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-latest-version.outputs.n8n_version }}-distroless
          name: n8n Runners v${{ needs.get-latest-version.outputs.n8n_version }} (Distroless)
          body: |
            ## 特性
            - 基于 Google Distroless (cc-debian12)
            - 从 n8n-io/n8n 官方源码构建 v${{ needs.get-latest-version.outputs.n8n_version }}
            - 多架构支持：amd64、arm64
            - **安全加固**：移除 shell、包管理器和所有系统工具
            - **最小化攻击面**：仅包含运行所需的二进制文件和库
            - **内置功能**：
              - JavaScript 和 Python 任务运行器
              - ffmpeg（用于视频/音频处理）
              - Python 包：markdown、Pillow、imageio-ffmpeg、numpy

            ## 可用镜像

            ### Distroless 镜像
            - `${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${{ needs.get-latest-version.outputs.n8n_version }}` (amd64 + arm64)
            - `${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:latest`

            ## 离线安装

            下载下方 tar 文件并加载：

            ```bash
            # 加载 Distroless 镜像
            docker load -i n8n-runners-distroless-${{ needs.get-latest-version.outputs.n8n_version }}-amd64.tar
            docker load -i n8n-runners-distroless-${{ needs.get-latest-version.outputs.n8n_version }}-arm64.tar
            ```

            ## 源码
            - 构建自：https://github.com/n8n-io/n8n/releases/tag/v${{ needs.get-latest-version.outputs.n8n_version }}

            ## 使用方法

            ### Distroless 镜像（推荐用于生产环境）
            ```bash
            docker run -d \
              -e N8N_RUNNERS_AUTH_TOKEN=your-token \
              -e N8N_RUNNERS_TASK_BROKER_URI=http://your-n8n:5679 \
              -p 5680:5680 \
              ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${{ needs.get-latest-version.outputs.n8n_version }}
            ```

            ## 拉取镜像
            ```bash
            docker pull ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-distroless:${{ needs.get-latest-version.outputs.n8n_version }}
            ```

            ## 安全说明
            Distroless 镜像不包含 shell 或调试工具，如果需要调试，请使用 Debian 版本镜像。
          draft: false
          prerelease: false
          files: /tmp/images/*.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
