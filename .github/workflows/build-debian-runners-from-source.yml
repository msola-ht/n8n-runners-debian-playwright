          name: n8n Runners v${{ needs.get-latest-version.outputs.n8n_version }} (Debian + Playwright)
          body: |
            ## 特性
            - 基于 Debian 11 bullseye-slim
            - 从 n8n-io/n8n 官方源码构建 v${{ needs.get-latest-version.outputs.n8n_version }}
