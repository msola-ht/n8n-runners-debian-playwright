          docker tag ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python:${VERSION} ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python:${VERSION}-arm64
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python:${VERSION}-arm64 -o /tmp/images/n8n-runners-python-${VERSION}-arm64.tar
          docker rmi ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python:${VERSION}-arm64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python:${VERSION}

          ls -la /tmp/images

      - name: Create Release
