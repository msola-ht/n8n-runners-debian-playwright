name: Build Debian-based n8n Runners (From Official Source)

on:
  workflow_dispatch:
    inputs:
      n8n_version:
        description: 'n8n version tag (leave empty for latest release)'
        required: false
        default: ''
      force_build:
        description: 'Force build even if image exists'
        required: false
        default: false
        type: boolean
      force_rebuild_playwright:
        description: 'Force rebuild Playwright image'
        required: false
        default: false
        type: boolean
      force_rebuild_python:
        description: 'Force rebuild Python image'
        required: false
        default: false
        type: boolean
      release_only:
        description: 'Only create release (skip build)'
        required: false
        default: false
        type: boolean
  schedule:
    # 每天检查一次新版本 (UTC 时间 00:00)
    - cron: '0 0 * * *'
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: lunare

jobs:
  # Step 1: 获取 n8n 最新发行版版本号
  get-latest-version:
    name: Get Latest n8n Version
    runs-on: ubuntu-latest
    outputs:
      n8n_version: ${{ steps.version.outputs.version }}
      n8n_tag: ${{ steps.version.outputs.tag }}
      source_repo: ${{ steps.version.outputs.source_repo }}

    steps:
      - name: Get latest n8n release
        id: version
        run: |
          if [ -n "${{ github.event.inputs.n8n_version }}" ]; then
            # 使用用户指定的版本
            TAG="${{ github.event.inputs.n8n_version }}"
            VERSION=$(echo "$TAG" | sed -E 's/^(v|n8n@)//')
            echo "Using specified version: $VERSION"
          else
            # 获取 n8n-io/n8n 最新 release 版本
            echo "Fetching latest n8n release from GitHub API..."

            # 获取最新 release 信息
            LATEST_RELEASE=$(curl -sL "https://api.github.com/repos/n8n-io/n8n/releases/latest" \
              -H "Accept: application/vnd.github.v3+json")

            # 获取原始 tag 名称
            TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
            # 提取版本号（移除 v 或 n8n@ 前缀）
            VERSION=$(echo "$TAG" | sed -E 's/^(v|n8n@)//')

            if [ "$TAG" = "null" ] || [ -z "$TAG" ]; then
              echo "::error::Failed to fetch latest version from GitHub API"
              exit 1
            fi

            echo "Latest n8n tag: $TAG"
            echo "Latest n8n version: $VERSION"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "source_repo=n8n-io/n8n" >> $GITHUB_OUTPUT

  # Step 2: 检查 Docker Hub 镜像是否已存在
  check-image:
    name: Check Docker Hub Image
    runs-on: ubuntu-latest
    needs: get-latest-version
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Check if image exists
        id: check
        run: |
          IMAGE_NAME="${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian"
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"

          echo "Checking if ${IMAGE_NAME}:${VERSION} exists..."

          # 检查镜像是否存在
          if docker manifest inspect ${IMAGE_NAME}:${VERSION} >/dev/null 2>&1; then
            echo "Image ${IMAGE_NAME}:${VERSION} already exists"
            if [ "${{ github.event.inputs.force_build }}" == "true" ]; then
              echo "Force build enabled, proceeding with build"
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "Skipping build (use force_build=true to override)"
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Image ${IMAGE_NAME}:${VERSION} does not exist, proceeding with build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # Step 3: 克隆 n8n 源代码并构建
  build-from-source:
    name: Build n8n from Source
    runs-on: ubuntu-latest
    needs: [get-latest-version, check-image]
    if: needs.check-image.outputs.should_build == 'true'
    outputs:
      n8n_version: ${{ needs.get-latest-version.outputs.n8n_version }}

    steps:
      - name: Checkout n8n repository
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.get-latest-version.outputs.source_repo }}
          ref: ${{ needs.get-latest-version.outputs.n8n_tag }}
          path: n8n-source
          sparse-checkout: |
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            turbo.json
            .npmrc
            patches/
            scripts/
            src/
            packages/
            tsconfig.json
          sparse-checkout-cone-mode: false

      - name: Show current commit
        working-directory: n8n-source
        run: |
          echo "Current commit:"
          git log -1 --oneline
          echo "Current tag:"
          git describe --tags --exact-match 2>/dev/null || echo "no tag"

      - name: Read pnpm version from source
        id: pnpm-version
        working-directory: n8n-source
        run: |
          # 读取 packageManager 字段，格式为 "pnpm@x.x.x"
          PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager")
          echo "packageManager: $PACKAGE_MANAGER"

          # 提取版本号
          PNPM_VERSION=$(echo "$PACKAGE_MANAGER" | sed 's/pnpm@//')
          echo "pnpm-version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "Detected pnpm version: $PNPM_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.pnpm-version }}

      - name: Try to restore node modules from cache
        id: cache-node
        uses: actions/cache@v4
        with:
          path: n8n-source/node_modules
          key: n8n-node-${{ needs.get-latest-version.outputs.n8n_version }}-${{ hashFiles('n8n-source/pnpm-lock.yaml') }}
          restore-keys: |
            n8n-node-${{ needs.get-latest-version.outputs.n8n_version }}-
            n8n-node-

      - name: Try to restore build output from cache
        id: cache-dist
        uses: actions/cache@v4
        with:
          path: n8n-source/dist
          key: n8n-dist-${{ needs.get-latest-version.outputs.n8n_version }}

      - name: Install dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: n8n-source
        run: |
          echo "Cache miss - Installing dependencies with pnpm..."
          pnpm install --frozen-lockfile

      - name: Build n8n
        if: steps.cache-dist.outputs.cache-hit != 'true'
        working-directory: n8n-source
        run: |
          echo "Cache miss - Building n8n..."
          pnpm build:n8n

      - name: Verify build output
        working-directory: n8n-source
        run: |
          echo "Verifying build output..."
          ls -la dist/
          ls -la dist/task-runner-javascript/ || echo "task-runner-javascript not found!"

          if [ ! -d "dist/task-runner-javascript" ]; then
            echo "::error::task-runner-javascript directory not found in dist/"
            exit 1
          fi

      - name: Build cache status
        run: |
          echo "### Cache Status :hammer_and_wrench:" >> $GITHUB_STEP_SUMMARY
          echo "- Node modules: ${{ steps.cache-node.outputs.cache-hit == 'true' && '✅ Restored from cache' || '❌ Cache miss - Built from source' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build output: ${{ steps.cache-dist.outputs.cache-hit == 'true' && '✅ Restored from cache' || '❌ Cache miss - Built from source' }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: task-runner-dist
          path: n8n-source/dist
          retention-days: 1

      - name: Create packages archive without node_modules
        run: |
          # 创建临时目录
          mkdir -p /tmp/packages-clean
          # 复制 packages 目录，排除 node_modules
          rsync -av --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            n8n-source/packages/ /tmp/packages-clean/

      - name: Upload packages artifacts (without node_modules)
        uses: actions/upload-artifact@v4
        with:
          name: task-runner-packages
          path: /tmp/packages-clean
          retention-days: 1

  # Step 4: 构建 Debian 镜像（多架构）
  build-debian-runners:
    name: Build Debian Runners
    runs-on: ubuntu-latest
    needs: [get-latest-version, build-from-source]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: task-runner-dist
          path: dist

      - name: Download packages artifacts
        uses: actions/download-artifact@v4
        with:
          name: task-runner-packages
          path: packages

      - name: Verify artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la dist/
          ls -la dist/task-runner-javascript/
          ls -la packages/@n8n/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.debian
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          build-args: |
            NODE_VERSION=22.21.0
            PYTHON_VERSION=3.13
            N8N_VERSION=${{ needs.get-latest-version.outputs.n8n_version }}
            N8N_RELEASE_TYPE=stable
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/n8n-runners-debian-${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-runners-debian-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/n8n-runners-debian-${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}.tar
          retention-days: 7

  # Step 5: 创建多架构 manifest
  create-manifest:
    runs-on: ubuntu-latest
    needs: [get-latest-version, build-debian-runners]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE_NAME="${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian"
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"

          # 创建版本标签的 manifest
          docker buildx imagetools create \
            -t ${IMAGE_NAME}:${VERSION} \
            ${IMAGE_NAME}:${VERSION}-amd64 \
            ${IMAGE_NAME}:${VERSION}-arm64

          echo "✅ Manifests created successfully!"
          echo "📍 Image: ${IMAGE_NAME}:${VERSION}"
          echo "📍 Multi-arch support: amd64, arm64"

  # Step 5.5: 检查 Playwright 镜像是否已存在
  check-playwright-image:
    name: Check Playwright Docker Hub Image
    runs-on: ubuntu-latest
    needs: [get-latest-version, create-manifest]
    if: |
      always() &&
      needs.create-manifest.result == 'success' &&
      github.event.inputs.force_rebuild_playwright != 'true'
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Check if Playwright image exists
        id: check
        run: |
          IMAGE_NAME="${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright"
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"

          echo "Checking if ${IMAGE_NAME}:${VERSION} exists..."

          # 检查镜像是否存在
          if docker manifest inspect ${IMAGE_NAME}:${VERSION} >/dev/null 2>&1; then
            echo "Image ${IMAGE_NAME}:${VERSION} already exists"
            echo "Skipping Playwright build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Image ${IMAGE_NAME}:${VERSION} does not exist, proceeding with build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # Step 6: 构建 Playwright 镜像（多架构）
  build-playwright-runners:
    name: Build Playwright Runners
    runs-on: ubuntu-latest
    needs: [get-latest-version, create-manifest, check-playwright-image]
    if: |
      always() &&
      (
        github.event.inputs.force_rebuild_playwright == 'true' ||
        needs.check-playwright-image.result == 'success' && needs.check-playwright-image.outputs.should_build == 'true'
      )
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Playwright image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.playwright
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            N8N_VERSION=${{ needs.get-latest-version.outputs.n8n_version }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/n8n-runners-playwright-${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}.tar

      - name: Upload Playwright image artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-runners-playwright-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/n8n-runners-playwright-${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}.tar
          retention-days: 7

  # Step 7: 创建 Playwright 多架构 manifest
  create-playwright-manifest:
    runs-on: ubuntu-latest
    needs: [get-latest-version, build-playwright-runners]
    if: |
      always() &&
      (
        github.event.inputs.force_rebuild_playwright == 'true' ||
        needs.build-playwright-runners.result == 'success'
      )

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push Playwright multi-arch manifest
        run: |
          IMAGE_NAME="${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright"
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"

          # 创建版本标签的 manifest
          docker buildx imagetools create \
            -t ${IMAGE_NAME}:${VERSION} \
            ${IMAGE_NAME}:${VERSION}-amd64 \
            ${IMAGE_NAME}:${VERSION}-arm64

          echo "✅ Playwright Manifests created successfully!"
          echo "📍 Image: ${IMAGE_NAME}:${VERSION}"
          echo "📍 Multi-arch support: amd64, arm64"

  # Step 7.5: 检查 Python 镜像是否已存在
  check-python-image:
    name: Check Python Docker Hub Image
    runs-on: ubuntu-latest
    needs: [get-latest-version, create-manifest]
    if: |
      always() &&
      needs.create-manifest.result == 'success' &&
      github.event.inputs.force_rebuild_python != 'true'
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Check if Python image exists
        id: check
        run: |
          IMAGE_NAME="${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python"
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"

          echo "Checking if ${IMAGE_NAME}:${VERSION} exists..."

          # 检查镜像是否存在
          if docker manifest inspect ${IMAGE_NAME}:${VERSION} >/dev/null 2>&1; then
            echo "Image ${IMAGE_NAME}:${VERSION} already exists"
            if [ "${{ github.event.inputs.force_rebuild_python }}" == "true" ]; then
              echo "Force rebuild enabled, proceeding with build"
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "Skipping Python build"
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Image ${IMAGE_NAME}:${VERSION} does not exist, proceeding with build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # Step 8: 构建 Python 镜像（多架构）
  build-python-runners:
    name: Build Python Runners
    runs-on: ubuntu-latest
    needs: [get-latest-version, create-manifest, check-python-image]
    if: |
      always() &&
      (
        github.event.inputs.force_rebuild_python == 'true' ||
        needs.check-python-image.result == 'success' && needs.check-python-image.outputs.should_build == 'true'
      )
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Python image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.python
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            N8N_VERSION=${{ needs.get-latest-version.outputs.n8n_version }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python:${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/n8n-runners-python-${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}.tar

      - name: Upload Python image artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-runners-python-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/n8n-runners-python-${{ needs.get-latest-version.outputs.n8n_version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}.tar
          retention-days: 7

  # Step 9: 创建 Python 多架构 manifest
  create-python-manifest:
    runs-on: ubuntu-latest
    needs: [get-latest-version, build-python-runners]
    if: |
      always() &&
      (
        github.event.inputs.force_rebuild_python == 'true' ||
        needs.build-python-runners.result == 'success'
      )

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push Python multi-arch manifest
        run: |
          IMAGE_NAME="${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python"
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"

          # 创建版本标签的 manifest
          docker buildx imagetools create \
            -t ${IMAGE_NAME}:${VERSION} \
            ${IMAGE_NAME}:${VERSION}-amd64 \
            ${IMAGE_NAME}:${VERSION}-arm64

          echo "✅ Python Manifests created successfully!"
          echo "📍 Image: ${IMAGE_NAME}:${VERSION}"
          echo "📍 Multi-arch support: amd64, arm64"

  # Step 7.5: 仅发布 Release（手动触发，从 Docker Hub 拉取镜像）
  release-only:
    name: Release Only (Pull from Docker Hub)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_only == 'true'
    permissions:
      contents: write

    steps:
      - name: Get version from input
        id: version
        run: |
          if [ -n "${{ github.event.inputs.n8n_version }}" ]; then
            VERSION="${{ github.event.inputs.n8n_version }}"
            VERSION=$(echo "$VERSION" | sed -E 's/^(v|n8n@)//')
          else
            # 获取最新版本
            LATEST_RELEASE=$(curl -sL "https://api.github.com/repos/n8n-io/n8n/releases/latest" \
              -H "Accept: application/vnd.github.v3+json")
            VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name' | sed -E 's/^(v|n8n@)//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating release for version: $VERSION"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull and export images from Docker Hub
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p /tmp/images

          # 使用 buildx 拉取并导出特定平台的镜像
          # Debian amd64
          docker pull --platform=linux/amd64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION}
          docker tag ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION} ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION}-amd64
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION}-amd64 -o /tmp/images/n8n-runners-debian-${VERSION}-amd64.tar
          docker rmi ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION}-amd64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION}

          # Debian arm64
          docker pull --platform=linux/arm64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION}
          docker tag ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION} ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION}-arm64
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION}-arm64 -o /tmp/images/n8n-runners-debian-${VERSION}-arm64.tar
          docker rmi ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION}-arm64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian:${VERSION}

          # Playwright amd64
          docker pull --platform=linux/amd64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${VERSION}
          docker tag ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${VERSION} ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${VERSION}-amd64
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${VERSION}-amd64 -o /tmp/images/n8n-runners-playwright-${VERSION}-amd64.tar
          docker rmi ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${VERSION}-amd64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${VERSION}

          # Playwright arm64
