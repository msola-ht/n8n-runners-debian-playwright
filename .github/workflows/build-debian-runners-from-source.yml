          docker tag ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${VERSION} ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${VERSION}-arm64
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${VERSION}-arm64 -o /tmp/images/n8n-runners-playwright-${VERSION}-arm64.tar
          docker rmi ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${VERSION}-arm64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright:${VERSION}

