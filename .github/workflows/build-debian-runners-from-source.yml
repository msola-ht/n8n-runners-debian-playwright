  # Step 10: 创建 GitHub Release
  create-release:
    runs-on: ubuntu-latest
    needs: [get-latest-version, create-python-manifest]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      needs.create-python-manifest.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README.md version
        run: |
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"
          # 更新 README.md 中的版本号
          if [ -f "README.md" ]; then
            # 替换所有镜像标签中的版本号
            sed -i "s|lunare/n8n-runners-debian:[0-9.]*|lunare/n8n-runners-debian:${VERSION}|g" README.md
            sed -i "s|lunare/n8n-runners-playwright:[0-9.]*|lunare/n8n-runners-playwright:${VERSION}|g" README.md
            sed -i "s|lunare/n8n-runners-python:[0-9.]*|lunare/n8n-runners-python:${VERSION}|g" README.md
            echo "Updated README.md with version: ${VERSION}"
            cat README.md
          fi

      - name: Commit README.md update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "chore: update README version to ${{ needs.get-latest-version.outputs.n8n_version }}" || echo "No changes to commit"
          git push || echo "No changes to push"

      - name: Update Docker Hub README for Debian
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-debian
          readme-path: ./README.md

      - name: Update Docker Hub README for Playwright
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-playwright
          readme-path: ./README.md

      - name: Update Docker Hub README for Python
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python
          readme-path: ./README.md

      - name: Download Debian image artifacts
        id: download-debian
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: n8n-runners-debian-*
          path: /tmp/images
          merge-multiple: true

      - name: Download Playwright image artifacts
        id: download-playwright
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: n8n-runners-playwright-*
          path: /tmp/images
          merge-multiple: true

      - name: Download Python image artifacts
        id: download-python
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: n8n-runners-python-*
          path: /tmp/images
          merge-multiple: true

      - name: Check if artifacts exist
        id: check-artifacts
        run: |
          if [ -d "/tmp/images" ] && [ "$(ls -A /tmp/images)" ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
            echo "Found build artifacts"
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            echo "No artifacts found, will pull from Docker Hub"
          fi

      - name: Rename image files
        if: steps.check-artifacts.outputs.has_artifacts == 'true'
        run: |
          VERSION="${{ needs.get-latest-version.outputs.n8n_version }}"
          cd /tmp/images

          # 遍历所有 tar 文件并重命名
          # artifact 下载后的文件名可能已经包含版本号：n8n-runners-{type}-{version}-{arch}.tar
          # 或者可能没有版本号：n8n-runners-{type}-{arch}.tar
          for file in *.tar; do
            if [ -f "$file" ]; then
              # 检查文件名是否已经包含版本号
              if echo "$file" | grep -q "${VERSION}"; then
                echo "File already has version: $file"
              else
                # 使用 sed 在架构名称前插入版本号
                new_name=$(echo "$file" | sed "s/-\(amd64\|arm64\)\.tar/-$VERSION-\1.tar/")
                mv "$file" "$new_name"
                echo "Renamed: $file -> $new_name"
              fi
            fi
          done

          ls -la

      - name: Set up Docker Buildx
        if: steps.check-artifacts.outputs.has_artifacts == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Pull and export images from Docker Hub
        if: steps.check-artifacts.outputs.has_artifacts == 'false'
