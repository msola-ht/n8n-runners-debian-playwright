          docker tag ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python:${VERSION} ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python:${VERSION}-amd64
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python:${VERSION}-amd64 -o /tmp/images/n8n-runners-python-${VERSION}-amd64.tar
          docker rmi ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python:${VERSION}-amd64 ${{ env.DOCKERHUB_USERNAME }}/n8n-runners-python:${VERSION}

